<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .cart-container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .table img {
            border-radius: 10px;
        }
        .total-price {
            font-size: 1.5rem;
            font-weight: bold;
        }
        .btn-custom {
            width: 100%;
        }
    </style>
</head>

<body>
    <div class="container cart-container">
        <h2 class="text-center text-primary">🛒 Shopping Cart</h2>
        <table class="table table-bordered table-hover text-center">
            <thead class="table-primary">
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Picture</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Subtotal</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="Cart : ${CartListModel}">
                    <td th:text="${Cart.IDProduct}"></td>
                    <td th:text="${Cart.tenSanPham}"></td>
                    <td><img th:src="${Cart.img}" class="img-fluid" style="width: 80px; height: auto;"></td>
                    <td th:text="${Cart.giaTien} + ' $'"></td>
                    <td>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/reduce/{IDProduct}(IDProduct=${Cart.IDProduct})}">➖</a>
                        <input th:value="${Cart.soLuong}" disabled class="text-center" style="width: 50px; border: none; background: transparent;">
                        <a class="btn btn-sm btn-outline-success" th:href="@{/increase/{IDProduct}(IDProduct=${Cart.IDProduct})}">➕</a>
                    </td>
                    <td class="text-success fw-bold" th:text="${Cart.soLuong * Cart.giaTien} + ' $'"></td>
                </tr>
            </tbody>
        </table>
        <div class="text-end total-price">
            Total: <span th:text="${session.totalPriceAll} + ' $'"></span>
        </div>
        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/buyProductInCart}" class="btn btn-success btn-custom">🛍 Buy Product</a>
            <a th:href="@{/}" class="btn btn-secondary btn-custom">⬅ Back</a>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
