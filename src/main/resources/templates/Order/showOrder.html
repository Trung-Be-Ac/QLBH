<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .form-container {
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        .form-control:disabled {
            background-color: #e9ecef;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <h2 class="text-center text-primary">Order Product</h2>
            <form th:action="@{/OrderProduct}" method="post">
                <input type="hidden" name="id" th:value="${BillOrder.IDProduct}">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" class="form-control" disabled name="Name4" placeholder="Input Name" th:value="${BillOrder.tenSanPham}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Product Type</label>
                    <input type="text" class="form-control" disabled name="Address4" placeholder="Type Product" th:value="${BillOrder.typeProduct.NameTypeProduct}">
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantity</label>
                    <input type="text" class="form-control" name="Quantity" placeholder="Input Quantity" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Buy Product</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
