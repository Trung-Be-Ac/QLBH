<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Page</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-image: url('https://cdn.pixabay.com/photo/2020/04/17/18/25/the-seller-5056399_1280.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            min-height: 100vh;
        }
        .container {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-top: 50px;
        }
        .table img {
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container mt-4 p-4">
        <h1 class="text-center text-primary">Welcome to Our Shop</h1>
        <div class="text-end">
            <div th:if="${session.AfterLogin == null}">
                <a class="btn btn-primary" th:href="@{/login}">Login</a>
                <a class="btn btn-success" th:href="@{/showsignup}">Sign Up</a>
            </div>
            <div th:if="${session.AfterLogin != null}">
                <h4>Welcome Back, <span th:text="${session.AfterLogin.ten}"></span></h4>
                <h5>Role: <span th:text="${session.AfterLogin.roleUser}"></span></h5>
                
                <div th:if="${session.AfterLogin.roleUser == 'User'}">
                    <a class="btn btn-info btn-sm" th:href="@{/ShowOrderUser}">View Order</a>
                    <a class="btn btn-secondary btn-sm" th:href="@{/ShowCart}">View Cart</a>
                </div>
                
                <a class="btn btn-warning" th:href="@{/logout}">LogOut</a>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="my-4">
            <form class="input-group" th:action="@{/searchProduct}" method="post">
                <input type="text" name="search" class="form-control" placeholder="Search Product">
                <button class="btn btn-primary" type="submit">Search</button>
            </form>
        </div>

        <!-- Product Table -->
        <table class="table table-hover table-bordered text-center">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Seller</th>
                    <th>Product</th>
                    <th>Type</th>
                    <th>Quantity</th>
                    <th>Image</th>
                    <th>Details</th>
                    <th th:if="${session.AfterLogin != null and session.AfterLogin.roleUser == 'Seller'}">Edit</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="Product : ${ProductList}">
                    <td th:text="${Product.IDProduct}"></td>
                    <td th:text="${Product.User.ten}"></td>
                    <td th:text="${Product.tenSanPham}"></td>
                    <td th:text="${Product.typeProduct.NameTypeProduct}"></td>
                    <td th:text="${Product.soLuong}"></td>
                    <td><img th:src="${Product.img}" alt="Product Image" style="width: 50px; height: 50px;"></td>
                    <td><a class="btn btn-info btn-sm" th:href="@{/ViewAllDetail/{IDProduct}(IDProduct=${Product.IDProduct})}">View</a></td>
                    <td th:if="${session.AfterLogin != null and session.AfterLogin.roleUser == 'Seller'}">
                        <a class="btn btn-warning btn-sm" th:href="@{/ShowEdit/{IDProduct}(IDProduct=${Product.IDProduct})}">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="text-center mt-3" th:if="${session.AfterLogin != null and session.AfterLogin.roleUser != 'User'and session.AfterLogin.roleUser != 'Admin'}">
            <a class="btn btn-success" th:href="@{/showaddProduct}">Add Product</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
